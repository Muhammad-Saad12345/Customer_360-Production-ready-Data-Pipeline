version: 2

models:
  - name: stg_hubspot_contacts
    description: "Staged CRM contacts from HubSpot"
    columns:
      - name: hubspot_contact_id
        data_tests:
          - not_null
          - unique
      - name: email
        data_tests:
          - not_null
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              values: ['hubspot']

  - name: stg_oms_orders
    description: "Staged orders from Order Management System"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: net_total_amount
        data_tests:
          - not_null
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              values: ['oms']

  - name: stg_pim_products
    description: "Staged product catalog from PIM"
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: product_name
        data_tests:
          - not_null
      - name: retail_price
        data_tests:
          - not_null

  - name: stg_loyalty
    description: "Staged customer loyalty ledger"
    columns:
      - name: loyalty_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: loyalty_tier
        data_tests:
          - not_null

  - name: stg_marketing_campaign_events
    description: "Staged campaign engagement events"
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        data_tests:
          - not_null

  - name: stg_zendesk_tickets
    description: "Staged support tickets from Zendesk"
    columns:
      - name: ticket_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null

  - name: bridge_customer_identity
    description: "Deterministic identity resolution bridge table mapping source IDs to Master Customer IDs"
    columns:
      - name: master_customer_id
        data_tests:
          - not_null
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              values: ['hubspot', 'oms', 'loyalty', 'marketing', 'zendesk']
      - name: source_customer_id
        data_tests:
          - not_null
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              values: [
                'authoritative_crm_primary',
                'authoritative_id_match',
                'exact_email_match',
                'exact_phone_match',
                'shared_customer_id_email_match',
                'unresolved_singleton_exception'
              ]
      - name: match_confidence
        data_tests:
          - not_null

  - name: dim_customer
    description: "Golden Customer conformed dimension with explicit survivorship hierarchy"
    columns:
      - name: master_customer_id
        data_tests:
          - not_null
          - unique
      - name: full_name
        data_tests:
          - not_null
      - name: loyalty_tier
        data_tests:
          - not_null
      - name: lifetime_net_spend
        data_tests:
          - not_null

  - name: dim_product
    description: "Conformed product dimension"
    columns:
      - name: product_key
        data_tests:
          - not_null
          - unique
      - name: retail_price
        data_tests:
          - not_null

  - name: dim_campaign
    description: "Conformed marketing campaign dimension"
    columns:
      - name: campaign_key
        data_tests:
          - not_null
          - unique

  - name: fact_order
    description: "Conformed transactional order fact table"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: master_customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: master_customer_id
      - name: net_total_amount
        data_tests:
          - not_null

  - name: fact_support_case
    description: "Conformed customer service case fact table"
    columns:
      - name: ticket_id
        data_tests:
          - not_null
          - unique
      - name: master_customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: master_customer_id

  - name: customer_360
    description: "Unified analytical 360-degree customer mart"
    columns:
      - name: master_customer_id
        data_tests:
          - not_null
          - unique
      - name: customer_churn_risk
        data_tests:
          - not_null
          - accepted_values:
              values: ['Low Risk / Healthy', 'Medium Risk', 'High Risk']
      - name: rfm_customer_segment
        data_tests:
          - not_null
          - accepted_values:
              values: ['Champions / VIP', 'Loyal Customers', 'New Buyers', 'At Risk', 'Dormant / Lapsed', 'Active Prospects', 'No Purchases']

  - name: dim_date
    description: "Standard calendar date dimension spine"
    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique
      - name: calendar_date
        data_tests:
          - not_null
      - name: calendar_year
        data_tests:
          - not_null
      - name: calendar_month
        data_tests:
          - not_null

  - name: fact_campaign_engagement
    description: "Conformed marketing campaign engagement fact table"
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: campaign_id
        data_tests:
          - not_null
      - name: master_customer_id
        data_tests:
          - not_null
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              values: ['marketing']

  - name: fact_loyalty_activity
    description: "Conformed loyalty activity fact table"
    columns:
      - name: loyalty_id
        data_tests:
          - not_null
          - unique
      - name: master_customer_id
        data_tests:
          - not_null
      - name: loyalty_tier
        data_tests:
          - not_null
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              values: ['loyalty']

  - name: mart_customer_metrics
    description: "Cohort-level customer metrics aggregation mart"
    columns:
      - name: rfm_customer_segment
        data_tests:
          - not_null
      - name: customer_churn_risk
        data_tests:
          - not_null
      - name: customer_count
        data_tests:
          - not_null
      - name: aggregate_net_revenue
        data_tests:
          - not_null

  - name: mart_executive_kpis
    description: "Enterprise-wide executive KPI summary mart"
    columns:
      - name: total_master_customers
        data_tests:
          - not_null
      - name: enterprise_net_revenue
        data_tests:
          - not_null
      - name: enterprise_csat_index
        data_tests:
          - not_null

  - name: fct_kpi_daily
    description: "Daily order KPIs by order date and currency: orders, buyers, revenue, AOV"
    columns:
      - name: order_date
        data_tests:
          - not_null
      - name: recognized_revenue
        data_tests:
          - not_null
