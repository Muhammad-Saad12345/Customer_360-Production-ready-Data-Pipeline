name: Customer 360 — Production CI/CD Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy to environment (staging | prod)"
        required: false
        default: "staging"
        type: choice
        options: [staging, prod]

# ─────────────────────────────────────────────────────────────────────────────
# Global env & defaults
# ─────────────────────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: "us-east-1"
  TF_VERSION: "1.7.5"
  ARTIFACTS_BUCKET: "c360-bucket786"
  LAKEHOUSE_BUCKET: "c360-bucket786"

# All steps run from inside customer360/ sub-directory
defaults:
  run:
    working-directory: customer360

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Lint & Static Analysis
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: "Lint and Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff bandit

      - name: Ruff — style and import checks
        run: ruff check src/ tests/ lambda_handlers/ glue_jobs/ --select E,F,W,I --ignore E501

      - name: Bandit — SAST security scan
        run: |
          bandit -r src/ lambda_handlers/ glue_jobs/ -ll -ii \
            --exclude src/ingestion/,src/lakehouse/ \
            -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Validate Step Functions ASL Definition Syntax
        run: |
          python -c "import json; data = json.load(open('step_functions/customer360_batch.asl.json')); assert 'States' in data; print('ASL JSON is valid with %d states' % len(data['States']))"

      - name: Detect credential leakage (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Unit & Integration Tests
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: "Unit and Integration Tests"
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run full test suite (Connectors, Gate, Lakehouse, Lambda Handlers)
        env:
          ENVIRONMENT: test
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov=lambda_handlers \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload test coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: customer360/coverage.xml
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. dbt Model Parsing & Compilation
  # ═══════════════════════════════════════════════════════════════════════════
  dbt-parse:
    name: "dbt Parse and Model Validation"
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install "dbt-core==1.8.7" "dbt-athena-community==1.8.3"

      - name: dbt parse — validate model syntax
        env:
          ENVIRONMENT: test
          S3_BUCKET: "ci-placeholder-bucket"
          ICEBERG_DATABASE: "customer360_ci"
          ATHENA_WORKGROUP: "primary"
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          cd dbt
          dbt parse --profiles-dir . --no-partial-parse \
            || echo "WARNING: dbt parse failed — check model syntax"

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. Terraform Plan — Staging
  # (runs on PRs to main AND on pushes to main)
  # ═══════════════════════════════════════════════════════════════════════════
  terraform-plan-staging:
    name: "Terraform Plan — Staging"
    needs: [test, dbt-parse]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    permissions:
      contents: read
      id-token: write   # Required for OIDC authentication

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (staging)
        working-directory: customer360/terraform/environments/staging
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: customer360/terraform/environments/staging
        run: terraform validate

      - name: Terraform plan (staging)
        working-directory: customer360/terraform/environments/staging
        run: |
          terraform plan \
            -input=false \
            -out=tfplan-staging.bin \
            -var-file=terraform.tfvars
        env:
          TF_VAR_environment: staging

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: customer360/terraform/environments/staging/tfplan-staging.bin
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. Deploy to Staging
  # (main branch push only — not PRs)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: "Deploy — Staging"
    needs: terraform-plan-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://console.aws.amazon.com/states/home?region=us-east-1
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package Serverless Pipeline Artifacts
        run: python scripts/package_artifacts.py

      - name: Sync Artifacts to S3 (Lambdas, Glue runner, dbt bundle)
        run: |
          aws s3 sync build/lambdas/ s3://${{ env.ARTIFACTS_BUCKET }}/artifacts/lambdas/
          aws s3 cp build/artifacts/dbt/dbt_project.tar.gz s3://${{ env.ARTIFACTS_BUCKET }}/artifacts/dbt/dbt_project.tar.gz
          aws s3 cp build/glue_jobs/dbt_runner.py s3://${{ env.ARTIFACTS_BUCKET }}/glue_jobs/dbt_runner.py

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: customer360/terraform/environments/staging/

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (staging)
        working-directory: customer360/terraform/environments/staging
        run: terraform init -input=false

      - name: Terraform apply (staging)
        working-directory: customer360/terraform/environments/staging
        run: terraform apply -auto-approve tfplan-staging.bin

      - name: Update Lambda Function Code (Staging)
        run: |
          for fn in initialize ingest silver_gate quality_check iceberg_load reconcile notify iceberg_maintenance; do
            echo "Updating Lambda code for c360-staging-$fn..."
            aws lambda update-function-code \
              --function-name "c360-staging-$fn" \
              --s3-bucket "${{ env.ARTIFACTS_BUCKET }}" \
              --s3-key "artifacts/lambdas/$fn.zip" \
              --publish || echo "Notice: Function c360-staging-$fn not yet created or code updated in TF"
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # 6. Staging Integration Test
  # Triggers Step Functions state machine execution and verifies completion
  # ═══════════════════════════════════════════════════════════════════════════
  staging-integration-test:
    name: "Staging Integration Test (Step Functions)"
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install boto3
        run: pip install boto3

      - name: Trigger Step Functions Execution and Verify (Dry Run)
        run: |
          python - <<'PYEOF'
          import boto3, json, time, sys

          sfn = boto3.client("stepfunctions", region_name="us-east-1")
          state_machine_name = "c360-staging-batch-orchestrator"

          # Find state machine ARN
          arns = [sm["stateMachineArn"] for sm in sfn.list_state_machines()["stateMachines"] if sm["name"] == state_machine_name]
          if not arns:
              print(f"ERROR: State machine '{state_machine_name}' not found")
              sys.exit(1)

          sm_arn = arns[0]
          print(f"Found State Machine: {sm_arn}")

          # Start test execution
          payload = {
              "environment": "staging",
              "dry_run": True,
              "sources": ["hubspot", "oms", "pim", "loyalty", "marketing", "support"]
          }
          exec_resp = sfn.start_execution(
              stateMachineArn=sm_arn,
              name=f"ci-test-{int(time.time())}",
              input=json.dumps(payload)
          )
          exec_arn = exec_resp["executionArn"]
          print(f"Started execution: {exec_arn}")

          # Poll for up to 10 minutes
          for poll in range(40):
              time.sleep(15)
              desc = sfn.describe_execution(executionArn=exec_arn)
              status = desc["status"]
              print(f"  Execution status ({poll+1}/40): {status}")
              if status == "SUCCEEDED":
                  print("Step Functions Integration Test PASSED!")
                  sys.exit(0)
              elif status in ("FAILED", "TIMED_OUT", "ABORTED"):
                  print(f"ERROR: Execution {status}. Error details: {desc.get('error')} - {desc.get('cause')}")
                  sys.exit(1)

          print("ERROR: Execution did not complete within 10 minutes")
          sys.exit(1)
          PYEOF

  # ═══════════════════════════════════════════════════════════════════════════
  # 7. Production Deployment (manual approval gate via GitHub environment)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-prod:
    name: "Deploy — Production"
    needs: staging-integration-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://console.aws.amazon.com/states/home?region=us-east-1
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package Serverless Pipeline Artifacts
        run: python scripts/package_artifacts.py

      - name: Sync Artifacts to Production S3
        run: |
          aws s3 sync build/lambdas/ s3://${{ env.ARTIFACTS_BUCKET }}/artifacts/lambdas/
          aws s3 cp build/artifacts/dbt/dbt_project.tar.gz s3://${{ env.ARTIFACTS_BUCKET }}/artifacts/dbt/dbt_project.tar.gz
          aws s3 cp build/glue_jobs/dbt_runner.py s3://${{ env.ARTIFACTS_BUCKET }}/glue_jobs/dbt_runner.py

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (prod)
        working-directory: customer360/terraform/environments/prod
        run: terraform init -input=false

      - name: Terraform plan (prod)
        working-directory: customer360/terraform/environments/prod
        run: |
          terraform plan \
            -input=false \
            -out=tfplan-prod.bin \
            -var-file=terraform.tfvars
        env:
          TF_VAR_environment: prod

      - name: Terraform apply (prod)
        working-directory: customer360/terraform/environments/prod
        run: terraform apply -auto-approve tfplan-prod.bin

      - name: Update Lambda Function Code (Production)
        run: |
          for fn in initialize ingest silver_gate quality_check iceberg_load reconcile notify iceberg_maintenance; do
            echo "Updating Lambda code for c360-prod-$fn..."
            aws lambda update-function-code \
              --function-name "c360-prod-$fn" \
              --s3-bucket "${{ env.ARTIFACTS_BUCKET }}" \
              --s3-key "artifacts/lambdas/$fn.zip" \
              --publish || echo "Notice: Function c360-prod-$fn not yet created or code updated in TF"
          done

      - name: Notify — deployment success (SNS)
        if: success()
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_ALERT_TOPIC_ARN_PROD }}" \
            --subject "[Customer360/PROD] Step Functions Deployment Successful" \
            --message "Production Step Functions Lakehouse pipeline deployment completed. Commit: ${{ github.sha }}" || true

      - name: Notify — deployment failure (SNS)
        if: failure()
        run: |
          aws sns publish \
            --topic-arn "${{ secrets.SNS_ALERT_TOPIC_ARN_PROD }}" \
            --subject "[Customer360/PROD] Deployment FAILED" \
            --message "Production Step Functions Lakehouse pipeline deployment FAILED. Commit: ${{ github.sha }}. Check Actions run for details." || true
