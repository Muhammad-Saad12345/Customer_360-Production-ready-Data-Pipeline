name: Test AWS OIDC Connection

on:
  workflow_dispatch:

# Senior Industry Standard: Permissions ko hamesha top level par rakhein 
permissions:
  id-token: write  # GitHub token ko AWS ke liye active karne ke liye ye sab se zaroori hai
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Direct hardcoded test ARN bina kisi secret dependency ke
          role-to-assume: arn:aws:iam::734143568343:role/GitHubActionsStagingRole
          aws-region: us-east-1

      - name: Verify Connection (Who Am I)
        run: |
          aws sts get-caller-identity
