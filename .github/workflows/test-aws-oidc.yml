name: Test AWS OIDC Connection

on:
  workflow_dispatch: # Is se aap manually button click kar ke test kar sakenge

permissions:
  id-token: write # AWS OIDC login ke liye ye sab se zaroori hai
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Verify Connection (Who Am I)
        run: |
          aws sts get-caller-identity
